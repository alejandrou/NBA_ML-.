name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check .

      # The path is named explicitly so the gate's scope is visible here rather
      # than implied by the working directory. `tests/`, `scripts/`, `alembic/`
      # and the legacy prototype are deliberately outside it.
      - name: Mypy
        run: uv run mypy src/nba_data

      - name: Pytest (offline)
        run: uv run pytest -m "not integration and not live"

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      # `nba_test_ci` is one of the two names the integration lane accepts, and
      # NBA_DATA_TEST_DATABASE is its explicit authorization to write there. The
      # database, the URL, and the health check below must name the same thing:
      # changing one alone leaves the service probing a database that does not
      # exist, which surfaces as an opaque startup timeout rather than an error.
      DATABASE_URL: postgresql+psycopg://nba:nba@localhost:5432/nba_test_ci
      NBA_DATA_TEST_DATABASE: "1"
      # Turns every environment-related skip -- missing flag, unreachable
      # database, schema off the migration head -- into a failure, so a job that
      # silently stopped testing anything cannot report success.
      NBA_DATA_REQUIRE_POSTGRES_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nba
          POSTGRES_PASSWORD: nba
          POSTGRES_DB: nba_test_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U nba -d nba_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Wait for PostgreSQL
        run: |
          uv run python - <<'PY'
          import os
          import time

          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import SQLAlchemyError

          engine = create_engine(
              os.environ["DATABASE_URL"],
              connect_args={"connect_timeout": 2},
          )
          try:
              for attempt in range(30):
                  try:
                      with engine.connect() as connection:
                          connection.execute(text("SELECT 1"))
                      print("PostgreSQL is ready.")
                      break
                  except SQLAlchemyError as exc:
                      if attempt == 29:
                          raise RuntimeError(
                              "PostgreSQL did not become ready in time."
                          ) from exc
                      time.sleep(1)
          finally:
              engine.dispose()
          PY

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Check Alembic migrations
        run: uv run alembic check

      # A revision that cannot be undone is a one-way door. The database here is
      # a throwaway service container, so the round trip is free.
      - name: Round-trip the newest Alembic revision
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic check

      # Run the directory so every integration test is included automatically.
      - name: Run PostgreSQL integration tests
        run: uv run pytest -ra tests/integration
